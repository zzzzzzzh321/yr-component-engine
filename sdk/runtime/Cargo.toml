[package]
name = "vera-mod-runtime"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Bounded, stateless WebAssembly component host for VERA gameplay modules"

[features]
test-support = ["dep:wat"]

[dependencies]
vera-mod-api = { path = "../api" }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wasmtime = { version = "=50.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wat = { version = "1", optional = true }

[dev-dependencies]
wat = "1"
